<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AWS deployment architecture for Assignment">
  <defs>
    <style>
      .title { font: 700 30px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .section { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .label { font: 600 17px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
      .sub { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .azure { fill: #edf6ff; stroke: #60a5fa; }
      .green { fill: #ecfdf5; stroke: #34d399; }
      .orange { fill: #fff7ed; stroke: #fb923c; }
      .purple { fill: #f5f3ff; stroke: #a78bfa; }
      .gray { fill: #f8fafc; stroke: #94a3b8; }
      .router { fill: #f8fafc; stroke: #94a3b8; }
      .line { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
      .badge { fill: #dbeafe; stroke: #60a5fa; stroke-width: 1.5; }
      .badgeText { font: 700 11px 'Segoe UI', Arial, sans-serif; fill: #1d4ed8; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <text x="800" y="55" text-anchor="middle" class="title">AWS Deployment Architecture for Assignment</text>

  <!-- Internet / Users -->
  <rect x="80" y="160" width="180" height="170" class="router"/>
  <text x="170" y="205" text-anchor="middle" class="section">Users</text>
  <text x="170" y="238" text-anchor="middle" class="small">Employees / Admins</text>
  <text x="170" y="265" text-anchor="middle" class="small">Web Browser</text>
  <text x="170" y="292" text-anchor="middle" class="small">Mobile / Desktop</text>

  <!-- Route53 -->
  <rect x="320" y="185" width="170" height="120" class="gray"/>
  <text x="405" y="225" text-anchor="middle" class="label">Amazon Route 53</text>
  <text x="405" y="255" text-anchor="middle" class="small">DNS / domain routing</text>
  <text x="405" y="276" text-anchor="middle" class="small">api.example.com</text>

  <!-- CloudFront + S3 -->
  <rect x="560" y="120" width="440" height="250" class="green"/>
  <text x="780" y="155" text-anchor="middle" class="section">AWS Edge &amp; Static Frontend</text>

  <rect x="590" y="180" width="180" height="120" class="box"/>
  <text x="680" y="220" text-anchor="middle" class="label">Amazon CloudFront</text>
  <text x="680" y="245" text-anchor="middle" class="small">CDN / caching</text>
  <text x="680" y="268" text-anchor="middle" class="small">SSL termination</text>

  <rect x="800" y="180" width="170" height="120" class="box"/>
  <text x="885" y="220" text-anchor="middle" class="label">Amazon S3</text>
  <text x="885" y="245" text-anchor="middle" class="small">React/Vite build</text>
  <text x="885" y="268" text-anchor="middle" class="small">Static assets</text>

  <!-- ALB and App tier -->
  <rect x="560" y="470" width="470" height="280" class="orange"/>
  <text x="795" y="510" text-anchor="middle" class="section">Application Tier</text>

  <rect x="610" y="545" width="180" height="130" class="box"/>
  <text x="700" y="585" text-anchor="middle" class="label">Application Load</text>
  <text x="700" y="608" text-anchor="middle" class="label">Balancer</text>
  <text x="700" y="635" text-anchor="middle" class="small">HTTPS / health checks</text>

  <rect x="830" y="545" width="170" height="130" class="box"/>
  <text x="915" y="585" text-anchor="middle" class="label">EC2 / ECS</text>
  <text x="915" y="610" text-anchor="middle" class="small">Java Spring Boot</text>
  <text x="915" y="634" text-anchor="middle" class="small">REST APIs</text>

  <rect x="620" y="700" width="380" height="35" rx="12" class="badge"/>
  <text x="810" y="722" text-anchor="middle" class="badgeText">Auto Scaling / Managed Compute</text>

  <!-- Data Tier -->
  <rect x="1090" y="470" width="350" height="280" class="purple"/>
  <text x="1265" y="510" text-anchor="middle" class="section">Data Tier</text>

  <rect x="1135" y="545" width="260" height="120" class="box"/>
  <text x="1265" y="585" text-anchor="middle" class="label">Amazon RDS</text>
  <text x="1265" y="610" text-anchor="middle" class="small">MySQL / PostgreSQL</text>
  <text x="1265" y="634" text-anchor="middle" class="small">Employee / payroll data</text>

  <rect x="1135" y="690" width="260" height="35" rx="12" class="badge"/>
  <text x="1265" y="712" text-anchor="middle" class="badgeText">Multi-AZ + automated backups</text>

  <!-- Security / Observability -->
  <rect x="560" y="780" width="880" height="82" class="gray"/>
  <text x="1000" y="810" text-anchor="middle" class="section">Security &amp; Operations</text>

  <rect x="610" y="827" width="160" height="20" class="box"/>
  <text x="690" y="842" text-anchor="middle" class="small">IAM</text>

  <rect x="805" y="827" width="170" height="20" class="box"/>
  <text x="890" y="842" text-anchor="middle" class="small">Secrets Manager</text>

  <rect x="1010" y="827" width="170" height="20" class="box"/>
  <text x="1095" y="842" text-anchor="middle" class="small">CloudWatch</text>

  <rect x="1210" y="827" width="180" height="20" class="box"/>
  <text x="1300" y="842" text-anchor="middle" class="small">WAF / Shield</text>

  <!-- lines -->
  <path d="M260 252 L320 252" class="line"/>
  <path d="M490 252 L560 252" class="line"/>
  <path d="M1000 250 L1040 250 L1040 420 L760 420 L760 470" class="dashed"/>
  <path d="M760 420 L760 470" class="dashed"/>
  <path d="M1020 610 L1090 610" class="line"/>
  <path d="M700 675 L700 770" class="dashed"/>
  <path d="M915 675 L915 770" class="dashed"/>
  <path d="M1265 675 L1265 770" class="dashed"/>

  <!-- App call flow labels -->
  <text x="300" y="330" class="sub">HTTPS requests</text>
  <text x="1015" y="430" class="sub">API calls</text>
  <text x="715" y="688" class="sub">Backend services</text>
  <text x="1188" y="732" class="sub">Persistent storage</text>

</svg>
